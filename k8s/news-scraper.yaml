apiVersion: apps/v1
kind: Deployment
metadata:
  name: news-scraper
  namespace: kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: news-scraper
  template:
    metadata:
      labels:
        app: news-scraper
    spec:
      containers:
        - name: news-scraper
          image: iamokjin/news-scraper:latest
          env:
            - name: TZ
              value: "Asia/Seoul"
            - name: REDIS_URL
              value: "redis://redis:6379"
            - name: KAFKA_BROKERS
              value: "my-cluster-kafka-bootstrap:9092"
            - name: KAFKA_TOPIC
              value: "news-topic"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
# Note: ${DOCKERHUB_USERNAME} should be replaced with actual username or handled via CD
