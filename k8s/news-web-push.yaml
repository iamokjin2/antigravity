apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-push-server
  namespace: kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-push-server
  template:
    metadata:
      labels:
        app: web-push-server
    spec:
      containers:
        - name: web-push-server
          image: iamokjin/web-push-server:latest
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: web-push-server
  namespace: kafka
spec:
  type: NodePort
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 31081
  selector:
    app: web-push-server
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: news-consumer-web-push
  namespace: kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: news-consumer-web-push
  template:
    metadata:
      labels:
        app: news-consumer-web-push
    spec:
      containers:
        - name: news-consumer-web-push
          image: iamokjin/news-consumer-web-push:latest
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          env:
            - name: TZ
              value: "Asia/Seoul"
            - name: KAFKA_BROKERS
              value: "my-cluster-kafka-bootstrap:9092"
            - name: KAFKA_TOPIC
              value: "news-topic"
            - name: WEB_PUSH_SERVER_URL
              value: "http://web-push-server:3000/push"
