name: Docker Build and Deploy

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Login to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/news-scraper:latest

    - name: Update Kubernetes deployment
      run: |
        # Optional: Add kubectl commands here if you have k8s access from GitHub
        # For now, this just ensures the image is updated in DockerHub
        echo "Image pushed to DockerHub. Update k8s manually or via CD."
